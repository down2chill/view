<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8ea0fc">
<title>Down2Chill</title>
<style>
:root{
  --bg:#f7f7fb; --card:#fff; --ink:#000042; --ink-soft:#2a2c63;
  --muted:#8b8fa8; --muted-2:#a4a7bd;
  --primary:#4038f0; --primary-ink:#4b46d6; --soft:#efeefd;
  --line:#e5e4f4; --line-2:#dfddf7;
  --blue:#2b6cf6; --blue-bg:#e6eefd; --green:#16a34a;
  --pad:20px; --r-lg:24px; --r-md:18px; --r-sm:14px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif;
  --disp:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  --navh:96px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:0 max(var(--pad),env(safe-area-inset-left)) 0 max(var(--pad),env(safe-area-inset-right))}
.sp{flex:1}
.center{text-align:center}

/* ============ sky header (home + calendar) ============ */
.sky{position:relative;isolation:isolate;
  background:linear-gradient(180deg,#7d8ffb 0%,#95a6fc 14%,#b4c0fd 30%,#d3dafd 48%,#eceefb 70%,var(--bg) 88%)}
.sky::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.85;
  background:
   radial-gradient(1.6px 1.6px at 18% 14%,#fff,transparent),
   radial-gradient(1.4px 1.4px at 34% 8%,#fff,transparent),
   radial-gradient(1.8px 1.8px at 62% 18%,#fff,transparent),
   radial-gradient(1.3px 1.3px at 78% 9%,#fff,transparent),
   radial-gradient(1.5px 1.5px at 88% 22%,#fff,transparent),
   radial-gradient(1.2px 1.2px at 47% 26%,#fff,transparent),
   radial-gradient(120px 60px at 12% 40%,rgba(255,255,255,.55),transparent),
   radial-gradient(150px 70px at 82% 46%,rgba(255,255,255,.45),transparent)}
.moon{position:absolute;right:14%;top:16px;width:44px;height:44px;border-radius:50%;
  background:#fdfbf3;box-shadow:0 0 22px 6px rgba(255,252,235,.55);z-index:-1}
.moon::after{content:"";position:absolute;left:-11px;top:-4px;width:44px;height:44px;border-radius:50%;
  background:linear-gradient(180deg,#9fb0fc,#c0c8fd)}
.brand{display:flex;align-items:center;gap:12px;padding-top:calc(14px + env(safe-area-inset-top));height:auto;min-height:60px}
.logo{position:relative;font:800 clamp(19px,5vw,23px)/1 var(--disp);letter-spacing:.06em;color:#0d1152}
.logo i{font-style:normal;color:#4b6bf5}
.logo b{position:absolute;right:-13px;top:-9px;font-size:12px;color:#f7b733}
.round-btn{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#fff;
  color:var(--ink);box-shadow:0 3px 12px rgba(40,40,120,.14);transition:transform .16s}
.round-btn:hover{transform:translateY(-1px)}
.page-h{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
.page-h h1{font:700 clamp(34px,10vw,46px)/1.02 var(--disp);letter-spacing:-.03em;margin:0}
.page-h .round-btn{margin-left:0}
.page-h .btns{margin-left:auto;display:flex;gap:12px}

/* segmented tabs */
.segs{display:flex;background:rgba(255,255,255,.72);border-radius:999px;padding:5px;gap:4px;
  box-shadow:0 3px 14px rgba(40,40,120,.1);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.segs button{flex:1;min-width:0;padding:13px 6px;border-radius:999px;font-size:clamp(14px,3.9vw,16px);
  font-weight:600;color:var(--ink);transition:background .18s,color .18s}
.segs button[aria-selected="true"]{background:#fff;color:var(--primary);
  box-shadow:0 2px 8px rgba(40,40,120,.12),inset 0 0 0 1px #e8e4fc}

/* search */
.searchbar{display:flex;align-items:center;gap:12px;background:#fff;border-radius:999px;
  padding:0 18px;height:58px;margin-top:16px;box-shadow:0 3px 14px rgba(40,40,120,.09)}
.searchbar input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--ink)}
.searchbar input::placeholder{color:var(--muted-2)}
.searchbar svg.i{color:var(--ink)}
.searchbar .filt{color:var(--primary-ink)}

/* ============ event cards (home) ============ */
.list-h{font:700 clamp(24px,6.4vw,30px)/1.1 var(--disp);letter-spacing:-.025em;margin:26px 0 0}
.mon-h{font:700 clamp(17px,4.6vw,19px)/1.2 var(--disp);color:#6b5fe0;margin:20px 0 12px}
.ecards{display:grid;gap:16px}
.ecard{position:relative;display:flex;gap:14px;background:var(--card);border-radius:22px;padding:11px;
  box-shadow:0 2px 10px rgba(30,30,100,.06);transition:transform .16s,box-shadow .16s}
.ecard:hover{transform:translateY(-2px);box-shadow:0 10px 24px -8px rgba(40,40,140,.22)}
.ecard .thumb{flex:none;width:35%;max-width:158px;aspect-ratio:9/10;border-radius:16px;object-fit:cover;background:var(--soft)}
.ebody{flex:1;min-width:0;display:flex;flex-direction:column;padding:8px 4px 4px 0}
.etop{display:flex;gap:10px;align-items:flex-start}
.einfo{flex:1;min-width:0}
.einfo h3{font:700 clamp(18px,4.9vw,21px)/1.2 var(--disp);letter-spacing:-.02em;margin:0 0 8px}
.eloc,.ewhen{display:flex;align-items:center;gap:7px;font-size:14.5px;color:var(--ink-soft);min-width:0}
.eloc{color:var(--primary-ink);margin-bottom:5px}
.eloc svg.i{width:16px;height:16px;flex:none;color:var(--primary)}
.eloc span,.ewhen span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.edate{flex:none;text-align:right;padding-top:34px;line-height:1}
.edate b{display:block;font:800 clamp(26px,7vw,32px)/1 var(--disp);letter-spacing:-.03em}
.edate span{display:block;margin-top:3px;font-size:13px;font-weight:700;color:var(--primary);letter-spacing:.04em}
.emore{position:absolute;top:12px;right:12px;display:grid;place-items:center;width:34px;height:34px;
  border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(30,30,100,.12);color:var(--ink);z-index:2}
.emore svg.i{width:18px;height:18px}
.ehost{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.ehost img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--soft)}
.ehost p{margin:0;font-size:13.5px;color:var(--ink-soft);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ehost b{color:var(--primary);font-weight:600}
.pill{flex:none;margin-left:auto;font-size:14px;font-weight:600;padding:8px 15px;border-radius:11px;white-space:nowrap}
.pill.host{background:var(--blue-bg);color:var(--blue)}
.pill.inv{background:#ece9fe;color:#5b46e8}
.pill.went{background:#eef0f5;color:#6b7091}
.empty{text-align:center;color:var(--muted);padding:46px 20px;font-size:15.5px}

/* ============ bottom nav ============ */
.bnav{position:fixed;z-index:25;left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));
  bottom:calc(14px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;
  display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:34px;background:#fff;
  box-shadow:0 10px 30px -8px rgba(50,40,140,.24),0 0 0 1px rgba(20,20,80,.04)}
.bnav-i{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;color:var(--ink);font-size:12.5px;font-weight:600;transition:color .18s}
.bnav-i svg.i{width:25px;height:25px;stroke-width:1.7}
.bnav-i[aria-current="page"]{color:var(--primary)}
.bnav-i[aria-current="page"] svg.i{stroke-width:2.1}
.bnav-new{flex:0 1 auto;display:flex;align-items:center;justify-content:center;gap:9px;height:58px;
  padding:0 clamp(14px,4.5vw,26px);border-radius:29px;color:#fff;font-size:clamp(14px,4vw,17px);font-weight:700;
  background:linear-gradient(100deg,#5b3ff0,#4a34ea);box-shadow:0 8px 20px -6px rgba(74,52,234,.6);
  white-space:nowrap;transition:filter .18s,transform .14s}
.bnav-new:hover{filter:brightness(1.07)}
.bnav-new:active{transform:scale(.98)}
.bnav-new .em{font-size:20px;line-height:1}
.has-nav{padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom))}

/* ============ calendar ============ */
.cal{background:var(--card);border-radius:var(--r-md);margin-top:16px;overflow:hidden;
  box-shadow:0 2px 10px rgba(30,30,100,.06)}
.cal-h{display:flex;align-items:center;gap:10px;padding:16px 14px}
.cal-h b{flex:1;text-align:center;font:700 clamp(17px,4.7vw,20px)/1.2 var(--disp)}
.cal-nav{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:var(--ink);transition:background .18s}
.cal-nav:hover{background:#f2f1fb}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line)}
.cal-dow span{padding:10px 2px;text-align:center;font-size:clamp(9.5px,2.7vw,11.5px);font-weight:700;
  letter-spacing:.06em;color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-c{position:relative;min-height:62px;padding:6px 3px 4px;border-top:1px solid var(--line);
  border-left:1px solid var(--line);text-align:center;transition:background .16s}
.cal-c:nth-child(7n+1){border-left:0}
button.cal-c:hover{background:#faf9ff}
.cal-c .d{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;
  font-size:clamp(13px,3.7vw,15.5px);font-weight:700;line-height:1}
.cal-c.out .d{color:#c3c5d6;font-weight:600}
.cal-c.sel .d{background:var(--primary);color:#fff;box-shadow:0 4px 12px -3px rgba(64,56,240,.6)}
.dots-row{display:flex;justify-content:center;gap:3px;margin-top:5px;min-height:7px;flex-wrap:wrap}
.dots-row i{width:6px;height:6px;border-radius:50%}
.ev-lab{display:none;font-size:10px;line-height:1.25;color:var(--ink-soft);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-lab i{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:3px;vertical-align:1px}
.cal-grid.week .cal-c{min-height:96px}
.cal-dow.week span{padding-bottom:4px}
.searchbar.cal-search{display:none}
.searchbar.cal-search.open{display:flex}
.no-hit{text-align:center;color:var(--muted);padding:40px 20px;font-size:15.5px}
.no-hit b{color:var(--ink)}

/* day panel */
.day{background:var(--card);border-radius:var(--r-md);margin-top:16px;overflow:hidden;
  box-shadow:0 2px 10px rgba(30,30,100,.06)}
.day-h{display:flex;align-items:center;gap:10px;width:100%;padding:17px 18px;text-align:left}
.day-h b{font:700 clamp(17px,4.7vw,20px)/1.2 var(--disp)}
.day-h em{margin-left:auto;font-style:normal;font-size:14px;color:var(--muted)}
.day-h svg.i{width:20px;height:20px;stroke-width:2.2;transition:transform .22s}
.day[data-open="0"] .day-h svg.i{transform:rotate(180deg)}
.day[data-open="0"] .day-list{display:none}
.drow{display:flex;align-items:center;gap:13px;padding:13px 18px;border-top:1px solid var(--line);width:100%;text-align:left}
.drow:hover{background:#faf9ff}
.drow>img{width:60px;height:60px;border-radius:14px;object-fit:cover;flex:none;background:var(--soft)}
.dinfo{flex:1;min-width:0}
.dtime{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--primary)}
.dtime i{width:8px;height:8px;border-radius:50%;flex:none}
.dinfo h4{margin:2px 0 3px;font:700 clamp(15.5px,4.2vw,17px)/1.25 var(--disp);letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dinfo .eloc{margin:0;font-size:13.5px}
.stack{display:flex;align-items:center;flex:none;padding-left:6px;border-left:1px solid var(--line)}
.stack img{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid #fff;margin-left:-9px;background:var(--soft)}
.stack img:first-child{margin-left:0}
.stack em{display:grid;place-items:center;min-width:32px;height:32px;padding:0 5px;border-radius:16px;
  background:var(--soft);color:var(--primary-ink);font-style:normal;font-size:12px;font-weight:700;
  border:2px solid #fff;margin-left:-9px}

/* ============ event detail ============ */
.top{display:flex;align-items:center;gap:6px;height:64px;padding-top:env(safe-area-inset-top)}
.icon-btn{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:var(--ink);transition:background .18s}
.icon-btn:hover{background:#ecebf7}
.icon-btn svg.i{width:24px;height:24px}
.title{font:700 clamp(32px,9vw,42px)/1.05 var(--disp);letter-spacing:-.025em;margin:6px 0 22px}
.hero{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r-lg);background:var(--soft)}
.grid{display:grid;gap:34px}
.grid>*{min-width:0}
.meta{margin-top:26px;display:grid;gap:18px}
.row{display:flex;align-items:center;gap:16px}
.row svg.i{color:var(--ink);width:26px;height:26px;stroke-width:1.7}
.host{display:flex;align-items:center;gap:14px}
.host img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--soft)}
.host p{margin:0;color:var(--ink-soft);font-size:17px}
.host b{font-weight:700;color:var(--ink)}
.pill-tag{margin-left:auto;background:var(--blue-bg);color:var(--blue);font-size:15px;font-weight:600;
  padding:9px 18px;border-radius:12px;white-space:nowrap}
.pill-tag.inv{background:#ece9fe;color:#5b46e8}
.row .when{font-size:17px}
.place b{display:block;font-size:17px;font-weight:700}
.place span{display:block;color:var(--muted);font-size:15.5px;margin-top:2px}
.sec{margin-top:36px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:0 0 16px}
h2{font:700 clamp(21px,5.4vw,24px)/1.2 var(--disp);letter-spacing:-.02em;margin:0}
.link{margin-left:auto;color:var(--primary);font-size:15px;font-weight:600}
.link-row{display:inline-flex;align-items:center;gap:8px;color:var(--primary);font-weight:600;font-size:15.5px}
.link-row svg.i{width:18px;height:18px;stroke-width:2}
.rsvp{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.rsvp button{display:flex;align-items:center;justify-content:center;gap:9px;min-height:60px;padding:0 6px;
  border-radius:var(--r-sm);background:#fbfbfe;border:1px solid var(--line-2);color:var(--primary-ink);
  font-size:15.5px;font-weight:600;transition:background .18s,border-color .18s,transform .12s}
.rsvp button svg.i{width:21px;height:21px}
.rsvp button:hover{border-color:#c9c5f2}
.rsvp button:active{transform:scale(.98)}
.rsvp button[aria-pressed="true"]{background:linear-gradient(180deg,#4a41f5,#3830e2);border-color:transparent;
  color:#fff;box-shadow:0 8px 18px -6px rgba(58,50,226,.55)}
.tally{text-align:center;margin:20px 0 0;font-size:16px;color:var(--ink-soft)}
.tally b{color:var(--primary);font-weight:700}
.tally i{font-style:normal;color:var(--muted-2);padding:0 6px}
.note{text-align:center;color:var(--muted);font-size:14.5px;margin:8px 0 0}
.about{margin:0;font-size:16.5px;line-height:1.62;color:var(--ink-soft)}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}
.chip{display:flex;align-items:center;gap:11px;min-height:56px;padding:0 14px;background:var(--soft);
  border-radius:var(--r-sm);color:var(--primary-ink);font-size:clamp(13.8px,3.7vw,15.5px);font-weight:500}
.chip svg.i{width:20px;height:20px;stroke-width:1.7}
.guests{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.guest{display:block;text-align:center;min-width:0}
.guest img{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;background:var(--soft);transition:transform .16s}
a.guest:hover img,.more-g:hover{transform:scale(1.05)}
.guest span{display:block;margin-top:9px;font-size:12.5px;font-weight:600;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.guest em{display:block;font-style:normal;font-size:11.5px;color:var(--primary);margin-top:2px}
.more-g{display:grid;place-content:center;text-align:center;width:100%;aspect-ratio:1;border-radius:50%;
  background:var(--soft);color:var(--primary);line-height:1.15;transition:transform .16s}
.more-g b{font-size:15px;font-weight:700}
.more-g small{font-size:9.5px;opacity:.85}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ghost{display:inline-flex;align-items:center;gap:9px;padding:11px 18px;border-radius:var(--r-sm);
  background:#fbfbfe;border:1px solid var(--line-2);color:var(--primary-ink);font-size:15px;font-weight:600;
  transition:border-color .18s,background .18s}
.ghost:hover{border-color:#c9c5f2;background:#fff}
.ghost svg.i{width:19px;height:19px}
.strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  margin-right:calc(-1 * max(var(--pad), env(safe-area-inset-right)));
  cursor:grab;overscroll-behavior-x:contain}
.strip.drag{cursor:grabbing;scroll-behavior:auto}
.strip.drag *{pointer-events:none}
.strip::-webkit-scrollbar{display:none}
.strip>*{flex:0 0 auto;scroll-snap-align:start;border-radius:var(--r-md)}
.strip img{width:112px;height:180px;object-fit:cover;background:var(--soft)}
.add-photo{width:112px;height:180px;display:grid;place-content:center;gap:5px;text-align:center;padding:8px;
  border:1.5px dashed #c9c5ef;background:#fafaff;color:var(--primary-ink)}
.add-photo svg.i{width:30px;height:30px;margin:0 auto;stroke-width:1.5}
.add-photo b{font-size:13.5px;font-weight:600}
.add-photo small{font-size:10.5px;color:var(--muted);line-height:1.3;display:block}
.strip-meta{margin:14px 0 6px;font-size:14.5px;color:var(--muted)}
.chat-card{display:flex;align-items:center;gap:14px;padding:16px;background:var(--soft);border-radius:var(--r-md)}
.av-wrap{position:relative;flex:none}
.av-wrap img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#ddd}
.badge{position:absolute;top:-4px;left:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;
  background:var(--primary);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid var(--soft)}
.chat-txt{min-width:0;flex:1}
.chat-txt b{display:block;font-size:16px;font-weight:700}
.chat-txt p{margin:3px 0 2px;font-size:15.5px;color:var(--ink-soft);overflow:hidden;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
.chat-txt small{color:var(--muted-2);font-size:13.5px}
.chat-card .ghost{background:#fff;flex:none}
.map-card{border-radius:var(--r-md);overflow:hidden;background:var(--card);box-shadow:0 1px 2px rgba(20,20,80,.05)}
.map{position:relative}
.map img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#e8eee6}
.pin{position:absolute;left:50%;top:44%;transform:translate(-50%,-100%);color:var(--primary);
  filter:drop-shadow(0 3px 5px rgba(0,0,60,.28))}
.pin svg.i{width:36px;height:36px;fill:var(--primary);stroke:none}
.map-label{position:absolute;left:50%;top:46%;transform:translateX(-50%);background:#fff;border-radius:9px;
  padding:6px 14px;font-size:14px;font-weight:600;box-shadow:0 3px 10px rgba(0,0,60,.14);white-space:nowrap}
.map-foot{display:flex;align-items:center;gap:14px;padding:16px}
.map-foot b{display:block;font-size:16.5px;font-weight:700}
.map-foot span{display:block;font-size:14.5px;color:var(--muted);margin-top:2px}
.map-foot .ghost{margin-left:auto;flex:none}
.details{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:6px 18px 10px}

.drow2{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}

.drow2 span{color:var(--ink-soft);font-size:15.5px}
.drow2 b{margin-left:auto;font-weight:700;font-size:15.5px;text-align:right}
.feed{list-style:none;margin:0;padding:0 0 0 4px;position:relative}
.feed::before{content:"";position:absolute;left:4px;top:14px;bottom:14px;width:2px;background:#e2e0f6;border-radius:1px}
.feed li{position:relative;display:flex;align-items:center;gap:11px;padding:9px 0 9px 22px}
.feed li::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:10px;height:10px;
  border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px var(--bg)}
.feed img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:var(--soft)}

.feed svg.ok{color:var(--green)}
.feed p{margin:0;font-size:15px;color:var(--ink-soft);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed b{font-weight:700;color:var(--ink)}
.feed time{margin-left:auto;font-size:13.5px;color:var(--muted-2);white-space:nowrap;padding-left:8px}
.caught{text-align:center;color:var(--muted-2);font-size:14.5px;margin:22px 0 0;padding-top:20px;border-top:1px solid var(--line)}
.dock{position:fixed;z-index:20;left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));
  bottom:calc(16px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;height:66px;border-radius:33px;
  display:flex;align-items:center;
  background:linear-gradient(90deg,#e7eefd 0%,#f8eefe 17%,#f4e4fe 31%,#eceafd 44%,#fbfaff 52%,#efeafd 63%,#f5e8fd 76%,#edf0fd 89%,#f3f7fe 100%);
  box-shadow:0 10px 30px -8px rgba(50,40,140,.22),0 0 0 1px rgba(255,255,255,.7) inset;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.dock a{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:10px;height:100%;
  color:var(--primary-ink);font-size:15px;font-weight:600}
.dock a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock a svg.i{width:21px;height:21px}
.gap{flex:none;width:96px;position:relative;height:100%}
.gap::before,.gap::after{content:"";position:absolute;top:50%;transform:translateY(-50%);width:1px;height:26px;background:rgba(10,11,69,.1)}
.gap::before{left:0}.gap::after{right:0}
.fab{position:absolute;left:50%;top:-16px;transform:translateX(-50%);width:82px;height:82px;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:radial-gradient(circle at 50% 38%,#fff 55%,#f4f1fe 100%);
  box-shadow:0 8px 22px -6px rgba(70,60,190,.3),0 0 0 1px rgba(255,255,255,.9);
  color:var(--primary-ink);transition:transform .16s}
.fab:hover{transform:translateX(-50%) translateY(-2px)}
.fab svg.i{width:27px;height:27px;stroke-width:1.7}
.fab b{font-size:11.5px;font-weight:600;letter-spacing:-.01em}
.has-dock{padding-bottom:calc(150px + env(safe-area-inset-bottom))}

/* ============ guests ============ */
.stats{background:var(--card);border-radius:var(--r-md);padding:20px 18px 16px;box-shadow:0 1px 2px rgba(20,20,80,.05)}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{text-align:center;position:relative}
.stat+.stat::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:var(--line)}
.stat b{display:block;font:700 clamp(22px,6vw,26px)/1.1 var(--disp)}
.stat span{display:block;margin-top:5px;font-size:14px;color:var(--ink-soft)}
.prog{height:8px;border-radius:4px;background:#eae8fa;margin:18px 0 14px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#4744fc,#5b46f5)}
.stats p{margin:0;text-align:center;font-size:14.5px;color:var(--ink-soft)}
.cta{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:62px;margin:16px 0 0;
  border-radius:var(--r-md);background:linear-gradient(90deg,#4a41f5,#4b31ea);color:#fff;font-size:17px;

.cta svg.i{width:24px;height:24px;stroke-width:1.9}
.lcard{background:var(--card);border-radius:var(--r-md);margin-top:16px;overflow:hidden;box-shadow:0 1px 2px rgba(20,20,80,.05)}
.lcard>h2{font-size:clamp(18px,4.8vw,20px);padding:18px 18px 0}
.lcard>.sub{margin:6px 0 0;padding:0 18px 14px;font-size:14.5px;color:var(--muted)}
.g-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line);position:relative}
.lcard>h2+.g-row,.lcard>.sub+.g-row{border-top:0}
.g-av{position:relative;flex:none}
.g-av img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--soft)}
.g-av.on::after{content:"";position:absolute;right:1px;bottom:1px;width:14px;height:14px;border-radius:50%;
  background:#22c55e;border:2.5px solid #fff}
.g-txt{min-width:0;flex:1}
.g-name{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.g-name b{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.tag{background:var(--soft);color:var(--primary-ink);font-size:12px;font-weight:700;padding:3px 9px;border-radius:7px}
.g-txt p{margin:3px 0 0;font-size:15px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-txt small{display:block;margin-top:2px;font-size:13.5px;color:var(--muted)}
.g-end{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none;color:var(--muted-2)}
.g-end em{font-style:normal;font-size:14.5px}
.g-end svg.i{width:20px;height:20px;stroke-width:2.2;color:var(--ink)}
.dots{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:var(--ink);transition:background .18s}
.dots:hover{background:#f0eff9}
.view-all{display:block;width:100%;text-align:center;padding:16px;border-top:1px solid var(--line);
  color:var(--primary);font-weight:600;font-size:16px}
.view-all:hover{background:#faf9ff}
.seg{display:flex;align-items:center;width:100%;background:var(--card);border-radius:var(--r-md);margin-top:14px;
  padding:20px 18px;box-shadow:0 1px 2px rgba(20,20,80,.05);font:700 clamp(17px,4.6vw,19px)/1.2 var(--disp);transition:background .18s}
.seg:hover{background:#fbfaff}
.seg svg.i{margin-left:auto;width:20px;height:20px;stroke-width:2.2;color:var(--ink)}
.slink{background:var(--card);border-radius:var(--r-md);margin-top:16px;box-shadow:0 1px 2px rgba(20,20,80,.05)}
.slink-top{display:flex;align-items:center;gap:14px;padding:18px}
.slink-top h2{font-size:clamp(18px,4.8vw,20px)}
.slink-top p{margin:5px 0 0;font-size:14.5px;color:var(--muted)}
.slink-top .ghost{margin-left:auto;flex:none}
.regen{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;
  border-top:1px solid var(--line);color:var(--primary);font-weight:600;font-size:16px}
.regen:hover{background:#faf9ff}
.menu{position:absolute;right:14px;top:calc(100% - 8px);z-index:30;min-width:240px;background:var(--card);
  border-radius:var(--r-md);padding:8px;box-shadow:0 18px 40px -10px rgba(20,20,80,.28),0 0 0 1px rgba(20,20,80,.06)}
.menu[hidden]{display:none}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:13px 12px;border-radius:11px;
  font-size:15.5px;text-align:left;transition:background .16s}
.menu button:hover{background:#f5f4fd}
.menu svg.i{width:21px;height:21px;color:var(--ink)}
.menu .danger,.menu .danger svg.i{color:#ef4444}

/* ============ photos page ============ */
.pmeta{margin:-8px 0 18px;color:var(--muted);font-size:15px}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pgrid button{padding:0;border-radius:14px;overflow:hidden;aspect-ratio:1;background:var(--soft);
  position:relative;display:block}
.pgrid img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.pgrid button:hover img{transform:scale(1.06)}
.pgrid .who{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:7px;
  padding:16px 10px 8px;color:#fff;font-size:12px;font-weight:600;
  background:linear-gradient(180deg,transparent,rgba(6,6,40,.72));opacity:0;transition:opacity .22s}
.pgrid button:hover .who,.pgrid button:focus-visible .who{opacity:1}
.pgrid .who img{width:22px;height:22px;border-radius:50%;flex:none}

.lightbox{position:fixed;inset:0;z-index:60;background:rgba(8,8,34,.94);
  display:flex;flex-direction:column;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lightbox[hidden]{display:none}
.lb-bar{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;color:#fff;flex:none}
.lb-bar .cnt{font-size:15px;font-weight:600;opacity:.85}
.lb-bar button{margin-left:auto;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;
  color:#fff;background:rgba(255,255,255,.14);transition:background .18s}
.lb-bar button:hover{background:rgba(255,255,255,.26)}
.lb-stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:0 12px}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.7)}
.lb-arrow{position:absolute;top:50%;transform:translateY(-50%);display:grid;place-items:center;
  width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;transition:background .18s}
.lb-arrow:hover{background:rgba(255,255,255,.3)}
.lb-arrow.prev{left:6px}.lb-arrow.next{right:6px}
.lb-cap{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));font-size:14px}
.lb-cap img{width:28px;height:28px;border-radius:50%}
.lb-cap span{opacity:.7}
body.lb-open{overflow:hidden}

/* ---- firebase debug page ---- */
.fb-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);
  padding:18px;margin-bottom:14px}
.fb-card h3{margin:0 0 6px;font:700 17px/1.25 var(--disp)}
.fb-card p{margin:0 0 14px;font-size:14.5px;color:var(--muted);line-height:1.5}
.fb-kv{display:flex;gap:10px;font-size:13.5px;padding:5px 0;border-top:1px solid var(--line)}
.fb-kv:first-of-type{border-top:0}
.fb-kv b{flex:none;width:118px;color:var(--ink-soft);font-weight:600}
.fb-kv span{min-width:0;word-break:break-all;color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
.fb-kv.bad span{color:#dc2626;font-weight:600}

.fb-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;

.fb-btn[disabled]{opacity:.5;filter:grayscale(.4);cursor:not-allowed;box-shadow:none}
.fb-btn.alt{background:#fbfbfe;border:1px solid var(--line-2);color:var(--primary-ink);box-shadow:none}
.fb-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fb-row label{font-size:14px;font-weight:600;color:var(--ink-soft)}

  padding:11px 12px;border:1px solid var(--line-2);border-radius:11px;background:#fbfbfe;color:var(--ink)}
.fb-log{background:#0d1030;border-radius:var(--r-sm);padding:14px;max-height:340px;overflow:auto;

.fb-prev{margin-top:12px;border-radius:12px;max-height:220px}
.fb-note{font-size:13.5px;color:var(--muted);margin:10px 0 0;line-height:1.55}
.fb-note code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:12.5px;color:var(--primary-ink)}

.skel{color:var(--muted);font-size:15px;padding:22px 0;text-align:center}
.lcard .skel{padding:34px 18px}
.banner{display:flex;align-items:center;gap:10px;margin-top:18px;padding:12px 14px;border-radius:var(--r-sm);
  background:#fff7e6;border:1px solid #f6e0b0;color:#8a6414;font-size:14px;line-height:1.45}
.banner svg.i{width:19px;height:19px;flex:none}
.banner a{color:var(--primary);font-weight:600;text-decoration:underline}

}
@media (max-width:370px){

}
@media (min-width:600px){

}

}

  .pgrid{grid-template-columns:repeat(4,1fr);gap:14px}
  .wrap.narrow{max-width:860px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

var DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function parse(iso){ var p=iso.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }

/* Date fields every view needs, derived from one ISO string */
function dparts(iso){
  var d=parse(iso);
  return { d:d, day:d.getDate(), mon:MON[d.getMonth()], monShort:MON[d.getMonth()].slice(0,3),
           monUp:MON[d.getMonth()].slice(0,3).toUpperCase(), dow:DOW[d.getDay()],

           key:iso, monKey:iso.slice(0,7) };
}

  if(ev._h) return ev;
  ev._h=true;
  var dp=dparts(ev.date);
  var others=POOL.filter(function(p){ return p!==ev.hostId; });
  var pick=function(n,off){ var r=[],i; for(i=0;i<n;i++) r.push(others[(i+off)%others.length]); return r; };
  var seedN = ev.id.length % 11;

  if(!ev.guests){
    var lines=['Looking forward to it.','See you there!','Count me in.','Wouldn\u2019t miss it.'];
    ev.guests=[{id:ev.hostId,msg:'Created this event',when:'Created this event',host:true,

        return {id:p,msg:lines[i%lines.length],when:'Invited '+(i+1)+' day'+(i?'s':'')+' ago by '+pf(ev.hostId)};
      }));
  }
  if(!ev.waiting){
    ev.waiting=pick(Math.min(ev.pending||0,4),seedN+5).map(function(p,i){
      return {id:p,when:'Invited '+(i+1)+' day'+(i?'s':'')+' ago by '+pf(ev.hostId)};
    });
  }
  if(!ev.photos){ ev.photos=[ev.img+'a',ev.img+'b',ev.img+'c',ev.img+'d']; }

      when: whens[k%whens.length] });
  }
  if(!ev.chat){
    ev.chat={fromId:ev.hostId,msg:'Everything\u2019s set for '+dp.dow+'.',time:'1 day ago',unread:0};
  }
  if(!ev.activity){
    ev.activity=[
      {id:ev.guests[1]?ev.guests[1].id:ev.hostId, ic:'check', ok:1, txt:'is Going', t:'2 hours ago'},
      {id:ev.hostId, ic:'pen', txt:'updated the event description', t:'Yesterday'},
      {id:ev.guests[2]?ev.guests[2].id:ev.hostId, ic:'check', ok:1, txt:'is Going', t:'2 days ago'}
    ];
  }
  if(!ev.chips){
    ev.chips=[['sun',ev.vibe],['users',ev.capacity+' max'],['money',ev.entry],
              [ev.invite==='Invite only'?'lock':'globe',ev.invite]];
  }
  return ev;
}

function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(s,n){ var d=parse(s); d.setDate(d.getDate()+n); return isoOf(d); }
function weekStart(s){ var d=parse(s); d.setDate(d.getDate()-d.getDay()); return isoOf(d); }

<script>
/* =====================================================================
   STORE — the single source the views render from.

   Every view reads STORE.events. Those objects are shaped exactly like a
   Firestore event document, so the same rendering code serves both modes:

     mode 'live'   onSnapshot streams docs straight in
     mode 'local'  the hardcoded SEED array is mapped into the same shape,
                   so the page still works before Firebase is configured
   ===================================================================== */
var STORE = {
  events: [],
  byId: {},
  mode: "local",
  ready: false,
  error: null,
  subs: [],

  onChange: function(fn){ this.subs.push(fn); },
  notify: function(){ this.subs.forEach(function(f){ try{ f(); }catch(e){ console.error(e); } }); },

  setEvents: function(list, mode){
    this.events = list.sort(function(a,b){
      return a.dateISO === b.dateISO ? a.timeSort - b.timeSort : (a.dateISO < b.dateISO ? -1 : 1);
    });
    this.byId = {};
    var self = this;
    this.events.forEach(function(e){
      self.byId[e.id] = e;
      if(e.slug && !self.byId[e.slug]) self.byId[e.slug] = e;   // slug links keep working
    });
    if(mode) this.mode = mode;
    this.ready = true;
    this.notify();
  },

  /* Merge subcollection payloads onto one event, then repaint. */
  setDetail: function(id, patch){
    var ev = this.byId[id];
    if(!ev) return;
    for(var k in patch) ev[k] = patch[k];
    this.notify();
  }
};

function findEvent(key){ return STORE.byId[key] || null; }

/* ---------- mapping ---------- */
function chipsFor(ev){
  return [
    ["sun",   ev.vibe],
    ["users", ev.capacity + " max"],
    ["money", ev.entry],
    [ev.inviteType === "Invite only" ? "lock" : "globe", ev.inviteType]
  ];
}

/* A Firestore event document -> render model (they are already the same shape;
   this only fills defaults so a partially-written doc cannot break a view). */
function docToModel(id, d){
  var c = d.counts || {};
  return {
    id: id, slug: d.slug || id,
    title: d.title || "Untitled", dateISO: d.dateISO || "1970-01-01",
    time: d.time || "", timeSort: d.timeSort != null ? d.timeSort : t24(d.time || ""),
    venue: d.venue || "", address: d.address || "", about: d.about || "",
    vibe: d.vibe || "Chill", capacity: d.capacity || "\u2014",
    entry: d.entry || "\u2014", inviteType: d.inviteType || "Invite only",
    dot: d.dot || "#6d28d9", role: d.role || "invited",
    coverUrl: d.coverUrl || "", thumbUrl: d.thumbUrl || d.coverUrl || "", mapUrl: d.mapUrl || "",
    hostName: d.hostName || "Host", hostAvatarUrl: d.hostAvatarUrl || "",
    counts: { going: c.going||0, maybe: c.maybe||0, cant: c.cant||0, pending: c.pending||0 },
    guestPreview: d.guestPreview || [],
    photoCount: d.photoCount || 0, lastPhotoLabel: d.lastPhotoLabel || "",
    guests: null, waiting: null, photos: null, activity: null, chat: null
  };
}

/* The hardcoded SEED record -> the identical render model. */
function seedToModel(ev){
  return {
    id: ev.id, slug: ev.id,
    title: ev.title, dateISO: ev.date, time: ev.time, timeSort: t24(ev.time),
    venue: ev.venue, address: ev.address, about: ev.about,
    vibe: ev.vibe, capacity: ev.capacity, entry: ev.entry, inviteType: ev.invite,
    dot: ev.dot, role: ev.role,
    coverUrl: IMG(ev.img, 1000, 1250), thumbUrl: IMG(ev.img, 400, 440), mapUrl: IMG(ev.map, 1200, 675),
    hostName: pn(ev.hostId), hostAvatarUrl: pav(ev.hostId),
    counts: { going: ev.going, maybe: ev.maybe, cant: ev.cant, pending: ev.pending },
    guestPreview: ev.guests.slice(0, 5).map(function(g){
      return { name: pn(g.id), avatarUrl: pav(g.id), isHost: !!g.host }; }),
    photoCount: ev.photoCount, lastPhotoLabel: ev.photoWhen,
    guests: null, waiting: null, photos: null, activity: null, chat: null,
    _seed: ev
  };
}

/* Subcollection payloads for an event, straight off the SEED record. */
function seedDetail(ev){
  var s = ev._seed;
  return {
    guests: s.guests.map(function(g){
      return { name: pn(g.id), avatarUrl: pav(g.id), message: g.msg || "",
               invitedLabel: g.when, isHost: !!g.host, isYou: !!g.you, status: "going" }; }),
    waiting: s.waiting.map(function(g){
      return { name: pn(g.id), avatarUrl: pav(g.id), message: "",
               invitedLabel: g.when, isHost: false, isYou: false, status: "pending" }; }),
    photos: s.allPhotos.map(function(p){
      return { url: IMG(p.seed, 1400, 1400), thumbUrl: IMG(p.seed, 600, 600),
               byName: pn(p.byId), byAvatarUrl: pav(p.byId), whenLabel: p.when }; }),
    activity: s.activity.map(function(a){
      return { personName: pn(a.id), personAvatarUrl: pav(a.id), icon: a.ic,
               isCheck: !!a.ok, text: a.txt, whenLabel: a.t, quote: !!a.quote }; }),
    chat: { fromName: pn(s.chat.fromId), fromAvatarUrl: pav(s.chat.fromId),
            text: s.chat.msg, whenLabel: s.chat.time, unread: s.chat.unread || 0 }
  };
}

function useLocalData(reason){
  STORE.error = reason || null;
  STORE.setEvents(SEED_EVENTS.map(seedToModel), "local");
}

/* ---------- queries over whatever is loaded ---------- */
function matches(ev, q){
  if(!q) return true;
  return ev.title.toLowerCase().indexOf(q.trim().toLowerCase()) > -1;
}
function eventsOn(iso, q){
  return STORE.events.filter(function(e){ return e.dateISO === iso && matches(e, q); });
}
function upcoming(){ return STORE.events.filter(function(e){ return e.dateISO >= TODAY; }); }
function past(){ return STORE.events.filter(function(e){ return e.dateISO < TODAY; })
  .slice().reverse(); }
function hosting(){ return STORE.events.filter(function(e){ return e.role === "hosting"; }); }
</script>
<script>
/* ================= tiny helpers ================= */
function h(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function ico(id,cls){ return '<svg class="i'+(cls?' '+cls:'')+'"><use href="#'+id+'"/></svg>'; }
function img(url,alt,cls){ return '<img'+(cls?' class="'+cls+'"':'')+' src="'+(url||'')+'" alt="'+
  h(alt||'')+'" loading="lazy" decoding="async">'; }
function fname(n){ return String(n||'').split(' ')[0]; }
function skel(msg){ return '<p class="skel">'+h(msg||'Loading\u2026')+'</p>'; }
function statusPill(ev){
  if(ev.dateISO<TODAY) return '<span class="pill went">'+(ev.role==='hosting'?'Hosted':'Went')+'</span>';
  return ev.role==='hosting' ? '<span class="pill host">Hosting</span>'
                             : '<span class="pill inv">Invited</span>';
}

/* ================= HOME ================= */
function eventCard(ev){
  var dp=dparts(ev.dateISO);
  return '<a class="ecard" href="#event/'+ev.id+'" data-nav>'+
    img(ev.thumbUrl, ev.title, 'thumb')+
    '<span class="emore" role="presentation">'+ico('more')+'</span>'+
    '<div class="ebody">'+
      '<div class="etop">'+
        '<div class="einfo">'+
          '<h3>'+h(ev.title)+'</h3>'+
          '<div class="eloc">'+ico('pin')+'<span>'+h(ev.venue)+'</span></div>'+
          '<div class="ewhen"><span>'+dp.dowShort+', '+dp.monShort+' '+dp.day+' \u00B7 '+h(ev.time)+'</span></div>'+
        '</div>'+
        '<div class="edate"><b>'+dp.day+'</b><span>'+dp.monUp+'</span></div>'+
      '</div>'+
      '<div class="ehost">'+img(ev.hostAvatarUrl,'')+
        '<p><span class="hb">Hosted by </span><b>'+h(fname(ev.hostName))+'</b> \u00B7 '+ev.counts.going+' going</p>'+
        statusPill(ev)+
      '</div>'+
    '</div></a>';
}

function groupByMonth(list){
  var out=[],last=null;
  list.forEach(function(ev){
    var dp=dparts(ev.dateISO);
    if(dp.monKey!==last){ out.push({month:dp.mon+(dp.year!==dparts(TODAY).year?' '+dp.year:'')}); last=dp.monKey; }
    out.push({ev:ev});
  });
  return out;
}

function dataBanner(){
  if(STORE.mode==='live') return '';
  return '<div class="banner">'+ico('globe')+'<span>'+
    (STORE.error ? h(STORE.error) : 'Showing bundled sample data \u2014 Firebase not connected.')+
    ' <a href="#debug" data-nav>Open debug</a></span></div>';
}

function homeList(tab,q){
  var list = (tab==='hosting'?hosting() : tab==='past'?past() : upcoming())
              .filter(function(e){ return matches(e,q); });
  if(!list.length){
    return q ? '<p class="no-hit">No events match <b>\u201C'+h(q)+'\u201D</b>.</p>'
             : '<p class="empty">Nothing here yet.</p>';
  }
  var body='',open=false;
  groupByMonth(list).forEach(function(row){
    if(row.month){ if(open) body+='</div>'; body+='<h3 class="mon-h">'+h(row.month)+'</h3><div class="ecards">'; open=true; }
    else body+=eventCard(row.ev);
  });
  if(open) body+='</div>';
  return body;
}

function renderHome(tab,q){

        '<button class="round-btn" type="button" data-focus-search aria-label="Search events">'+ico('search')+'</button>'+
        '<button class="round-btn" type="button" aria-label="Filters">'+ico('sliders')+'</button>'+
      '</div></div>'+
      '<div class="segs" role="tablist">'+

      '<div class="searchbar">'+ico('search')+
        '<input type="search" id="q-home" placeholder="Search events" aria-label="Search events" value="'+h(q||'')+'">'+
        '<span class="filt">'+ico('sliders')+'</span></div>'+
    '</div></div>'+
    '<div class="wrap">'+dataBanner()+'<h2 class="list-h">'+heading+'</h2>'+
      '<div id="list-body">'+homeList(tab,q)+'</div></div>';
}

/* ================= CALENDAR ================= */
var calState={ y:2021, m:6, sel:TODAY, mode:'month', q:'', open:1 };

function calCell(iso,out,q,maxLab){
  var evs=out?[]:eventsOn(iso,q), sel=(!out && iso===calState.sel), d=parse(iso);
  return '<button type="button" class="cal-c'+(out?' out':'')+(sel?' sel':'')+'" data-day="'+iso+'"'+
    (out?' tabindex="-1"':' aria-label="'+d.getDate()+' '+MON[d.getMonth()]+', '+evs.length+' events"')+'>'+
    '<span class="d">'+d.getDate()+'</span>'+
    '<span class="dots-row">'+evs.slice(0,3).map(function(e){
      return '<i style="background:'+e.dot+'"></i>'; }).join('')+'</span>'+
    evs.slice(0,maxLab).map(function(e){
      return '<span class="ev-lab"><i style="background:'+e.dot+'"></i>'+h(e.title)+'</span>'; }).join('')+
    '</button>';
}

function calBody(){
  var q=calState.q, cells='', label='', i;
  if(calState.mode==='week'){
    var ws=weekStart(calState.sel), we=addDays(ws,6);
    var a=dparts(ws), b=dparts(we);
    label = a.monShort+' '+a.day+' \u2013 '+(a.mon===b.mon? b.day : b.monShort+' '+b.day)+', '+b.year;
    for(i=0;i<7;i++) cells+=calCell(addDays(ws,i),false,q,3);
  } else {
    var y=calState.y, m=calState.m,
        firstDow=new Date(y,m,1).getDay(), dim=new Date(y,m+1,0).getDate(),
        total=Math.ceil((firstDow+dim)/7)*7;
    label = MON[m]+' '+y;
    for(i=0;i<total;i++){
      var dn=i-firstDow+1, d=new Date(y,m,dn);
      cells+=calCell(isoOf(d), dn<1||dn>dim, q, 2);
    }
  }

  var dp=dparts(calState.sel), dayEvs=eventsOn(calState.sel,q);
  var rows = dayEvs.length ? dayEvs.map(function(ev){
    var stack=ev.guestPreview.slice(0,3).map(function(g){ return img(g.avatarUrl,''); }).join('');
    var extra=Math.max(0, ev.counts.going-3);
    return '<a class="drow" href="#event/'+ev.id+'" data-nav>'+
      img(ev.thumbUrl,'')+
      '<div class="dinfo">'+
        '<div class="dtime"><i style="background:'+ev.dot+'"></i>'+h(ev.time)+'</div>'+
        '<h4>'+h(ev.title)+'</h4>'+
        '<div class="eloc">'+ico('pin')+'<span>'+h(ev.venue)+'</span></div>'+
      '</div>'+
      '<span class="stack">'+stack+(extra?'<em>+'+extra+'</em>':'')+'</span>'+
      statusPill(ev)+
    '</a>';
  }).join('')
   : (q ? '<p class="no-hit">No events match <b>\u201C'+h(q)+'\u201D</b> on this day.</p>'
        : '<p class="empty">No events on this day.</p>');

  return '<div class="cal">'+
      '<div class="cal-h">'+
        '<button class="cal-nav" type="button" data-step="-1" aria-label="Previous">'+ico('chevl')+'</button>'+
        '<b>'+label+'</b>'+
        '<button class="cal-nav" type="button" data-step="1" aria-label="Next">'+ico('chev')+'</button>'+
      '</div>'+
      '<div class="cal-dow'+(calState.mode==='week'?' week':'')+'">'+
        ['SUN','MON','TUE','WED','THU','FRI','SAT'].map(function(d){ return '<span>'+d+'</span>'; }).join('')+'</div>'+
      '<div class="cal-grid'+(calState.mode==='week'?' week':'')+'">'+cells+'</div>'+
    '</div>'+
    '<div class="day" data-open="'+calState.open+'">'+
      '<button class="day-h" type="button" data-toggle>'+
        '<b>'+dp.dow+', '+dp.mon+' '+dp.day+'</b>'+
        '<em>'+dayEvs.length+' event'+(dayEvs.length===1?'':'s')+'</em>'+ico('chevu')+
      '</button>'+
      '<div class="day-list">'+rows+'</div>'+
    '</div>';
}

function renderCalendar(){
  return '<div class="sky"><div class="wrap">'+
      '<div class="brand"><a class="round-btn" href="#home" data-back="home" aria-label="Back to events">'+ico('chevl')+'</a>'+
        '<span class="logo">DOWN<i>2</i>CHILL<b>\u2726</b></span></div>'+

      '<div class="page-h"><h1>Calendar</h1><div class="btns">'+

/* ================= GUESTS ================= */

  function goingRow(g){

    '<p>'+invites+' invitations &nbsp;\u00B7&nbsp; '+responses+' responses</p></div>'+
    '<button class="cta" type="button">'+ico('user-plus')+'Invite More Friends</button>'+

    '<button class="seg" type="button">Maybe ('+c.maybe+')'+ico('chev')+'</button>'+

<script>
(function(){
  var app=document.getElementById('app'),
      chrome=document.getElementById('chrome'),
      menu=document.getElementById('row-menu'),
      lb=document.getElementById('lightbox'),
      anchor=null, homeTab='upcoming', homeQ='', scrolls={}, curKey='', watching=null,
      lbEvent=null, lbIdx=0;

  function route(){
    var hash=location.hash.replace(/^#/,''), parts=hash.split('/');
    if(parts[0]==='event')  return {v:'event',  id:parts[1]};
    if(parts[0]==='guests') return {v:'guests', id:parts[1]};
    if(parts[0]==='photos') return {v:'photos', id:parts[1]};
    if(parts[0]==='calendar') return {v:'calendar'};
    if(parts[0]==='debug') return {v:'debug'};
    return {v:'home'};
  }

  function render(){
    closeMenu();
    var r=route(), key=location.hash||'#home';

    /* Detail views stream their subcollections; attach on entry, drop on exit. */
    var wants = (r.v==='event'||r.v==='guests'||r.v==='photos') ? r.id : null;
    if(wants !== watching){
      if(window.D2C && D2C.unwatchEvent) D2C.unwatchEvent();
      watching = wants;
      if(wants && window.D2C && D2C.watchEvent) D2C.watchEvent(wants);
    }

    if(!STORE.ready){ app.innerHTML=loadingView(); chrome.innerHTML=''; return; }
    var curKeyChanged = curKey !== key;
    if(curKey && curKeyChanged) scrolls[curKey]=window.scrollY;

    closeLb();
    if(r.v==='home'){      app.innerHTML=renderHome(homeTab,homeQ); chrome.innerHTML=bottomNav('home'); }
    else if(r.v==='calendar'){ app.innerHTML=renderCalendar();  chrome.innerHTML=bottomNav('calendar'); }
    else if(r.v==='event'){    app.innerHTML=renderEvent(r.id); chrome.innerHTML=eventDock(); }
    else if(r.v==='photos'){   app.innerHTML=renderPhotos(r.id);chrome.innerHTML=''; }
    else if(r.v==='debug'){    app.innerHTML=renderDebug();     chrome.innerHTML=bottomNav(''); }
    else {                     app.innerHTML=renderGuests(r.id);chrome.innerHTML=''; }

    document.body.className = (r.v==='event') ? 'has-dock'
                            : (r.v==='guests'||r.v==='photos') ? '' : 'has-nav';

    curKey=key;
    var restore = curKeyChanged ? (scrolls[key]!=null ? scrolls[key] : 0) : window.scrollY;
    if(curKeyChanged) window.scrollTo(0, (r.v==='guests'||r.v==='photos') ? 0 : restore);
  }

  function go(hash){
    var d=(history.state&&history.state.d)||0;
    history.pushState({d:d+1},'',hash);
    render();
  }
  function back(fallback){
    var d=(history.state&&history.state.d)||0;
    if(d>0) history.back();
    else { history.replaceState({d:0},'','#'+fallback); render(); }
  }

  /* ---------- delegated events ---------- */
  document.addEventListener('click',function(e){
    var t=e.target;

    var backEl=t.closest('[data-back]');
    if(backEl){ e.preventDefault(); back(backEl.dataset.back); return; }

    var nav=t.closest('a[data-nav]');
    if(nav){ e.preventDefault(); go(nav.getAttribute('href')); return; }

    var tab=t.closest('[data-tab]');
    if(tab){ homeTab=tab.dataset.tab; render(); return; }

    var step=t.closest('[data-step]');
    if(step){
      var n=+step.dataset.step;
      if(calState.mode==='week'){ calState.sel=addDays(calState.sel,7*n); }
      else{
        calState.m+=n;
        if(calState.m<0){ calState.m=11; calState.y--; }
        if(calState.m>11){ calState.m=0; calState.y++; }
      }
      paintCal(); return;
    }

    var mode=t.closest('[data-mode]');
    if(mode){
      calState.mode=mode.dataset.mode;
      if(calState.mode==='month'){
        var d=parse(calState.sel); calState.y=d.getFullYear(); calState.m=d.getMonth();
      }
      render(); return;
    }

    var day=t.closest('[data-day]');
    if(day && !day.classList.contains('out')){
      calState.sel=day.dataset.day;
      if(calState.mode==='month'){
        var dd=parse(calState.sel); calState.y=dd.getFullYear(); calState.m=dd.getMonth();
      }
      paintCal(); return;
    }

    var tog=t.closest('[data-toggle]');
    if(tog){ var dy=tog.closest('.day');
      dy.dataset.open = dy.dataset.open==='1'?'0':'1';
      calState.open = +dy.dataset.open; return; }

    if(t.closest('[data-focus-search]')){
      var qi=document.getElementById('q-home');
      if(qi){ qi.focus(); qi.select(); }
      return;
    }
    if(t.closest('[data-toggle-search]')){
      var bar=document.querySelector('.cal-search');
      if(bar){ bar.classList.toggle('open');
        if(bar.classList.contains('open')) bar.querySelector('input').focus();
        else { calState.q=''; bar.querySelector('input').value=''; paintCal(); } }
      return;
    }

    var ph=t.closest('[data-ph]');
    if(ph){ openLb(route().id, +ph.dataset.ph); return; }
    var lbs=t.closest('[data-lb-step]');
    if(lbs){ stepLb(+lbs.dataset.lbStep); return; }
    if(t.closest('[data-lb-close]') || (lbEvent && t===lb)){ closeLb(); return; }

    var rs=t.closest('#rsvp button[data-k]');
    if(rs){ rsvp(rs); return; }

    var dots=t.closest('.dots');
    if(dots){
      e.stopPropagation();
      if(anchor===dots){ closeMenu(); return; }
      closeMenu(); anchor=dots; dots.setAttribute('aria-expanded','true');
      dots.closest('.g-row').appendChild(menu); menu.hidden=false; return;
    }
    if(!t.closest('#row-menu')) closeMenu();
  });

  function paintCal(){
    var el=document.getElementById('cal-body');
    if(el) el.innerHTML=calBody();
  }

  document.addEventListener('input',function(e){
    if(e.target.id==='q-home'){
      homeQ=e.target.value;
      var el=document.getElementById('list-body');
      if(el) el.innerHTML=homeList(homeTab,homeQ);
    } else if(e.target.id==='q-cal'){
      calState.q=e.target.value;
      paintCal();
    }
  });

  /* ---------- lightbox ---------- */
  function openLb(id,i){
    lbEvent=findEvent(id); if(!lbEvent || !lbEvent.photos) return;
    lbIdx=i; lb.innerHTML=lightbox(lbEvent,i); lb.hidden=false;
    document.body.classList.add('lb-open');
    var c=lb.querySelector('[data-lb-close]'); if(c) c.focus();
  }
  function stepLb(n){
    if(!lbEvent) return;
    var len=(lbEvent.photos||[]).length; if(!len) return;
    lbIdx=(lbIdx+n+len)%len;
    lb.innerHTML=lightbox(lbEvent,lbIdx);
  }
  function closeLb(){
    if(lb.hidden) return;
    lb.hidden=true; lb.innerHTML=''; lbEvent=null;
    document.body.classList.remove('lb-open');
  }

  /* ---------- drag-to-scroll photo strips ---------- */
  document.addEventListener('pointerdown',function(e){
    var st=e.target.closest('.strip'); if(!st || e.button) return;
    var x0=e.clientX, l0=st.scrollLeft, moved=false;
    function mv(ev){
      var dx=ev.clientX-x0;
      if(!moved && Math.abs(dx)>4){ moved=true; st.classList.add('drag'); }
      if(moved) st.scrollLeft=l0-dx;
    }
    function up(){
      document.removeEventListener('pointermove',mv);
      document.removeEventListener('pointerup',up);
      setTimeout(function(){ st.classList.remove('drag'); },0);
    }
    document.addEventListener('pointermove',mv);
    document.addEventListener('pointerup',up);
  });

  function rsvp(btn){
    var box=btn.parentNode, k=btn.dataset.k,
        cur=box.querySelector('[aria-pressed="true"]');
    if(cur===btn) return;
    var n={going:+box.dataset.going, maybe:+box.dataset.maybe, cant:+box.dataset.cant};
    if(cur) n[cur.dataset.k]--;
    n[k]++;
    box.dataset.going=n.going; box.dataset.maybe=n.maybe; box.dataset.cant=n.cant;
    Array.prototype.forEach.call(box.children,function(b){
      b.setAttribute('aria-pressed', String(b===btn)); });
    ['going','maybe','cant'].forEach(function(x){
      var el=document.getElementById('c-'+x); if(el) el.textContent=n[x]; });
  }

  function closeMenu(){
    menu.hidden=true;
    if(anchor){ anchor.setAttribute('aria-expanded','false'); anchor=null; }
  }
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){ closeMenu(); closeLb(); }
    if(lbEvent){
      if(e.key==='ArrowRight') stepLb(1);
      if(e.key==='ArrowLeft')  stepLb(-1);
    }
  });

  function loadingView(){
    return '<div class="wrap"><header class="top"></header>'+
      '<h1 class="title">Events</h1><p class="skel">Loading events\u2026</p></div>';
  }

  /* Any store change — first load, a new event, an edited doc, a subcollection
     arriving — repaints the current view in place. */
  STORE.onChange(function(){
    var y=window.scrollY;
    render();
    window.scrollTo(0,y);
  });

  window.addEventListener('popstate',render);
  window.addEventListener('hashchange',render);
  if(!history.state) history.replaceState({d:0},'',location.hash||'#home');
  render();
})();
</script>

<script type="module">
/* =====================================================================
   FIREBASE  —  fill in apiKey and the WEB appId below.
   Your pasted appId ended in ":ios:" which the JS SDK cannot use.
   Firebase Console -> Project settings -> General -> Your apps
     -> Add app -> Web  ->  copy apiKey + appId from that config.
   ===================================================================== */
const FB_CONFIG = {
  apiKey:            "__FIREBASE_API_KEY__",               // substituted at build time
  authDomain:        "down2chill-cc664.firebaseapp.com",
  projectId:         "down2chill-cc664",
  storageBucket:     "down2chill-cc664.appspot.com",
  messagingSenderId: "202068437157",
  appId:             "__FIREBASE_APP_ID__"                 // substituted at build time
};

/* A placeholder is a non-empty string, so a plain truthiness test would treat
   an unsubstituted build as configured. These check for real values.        */
const KEY_OK = !!FB_CONFIG.apiKey && !FB_CONFIG.apiKey.startsWith("__");
const APP_OK = /:web:/.test(FB_CONFIG.appId || "");
const UNSUBBED = (v) => (v || "").startsWith("__");

const SDK = "https://www.gstatic.com/firebasejs/12.3.0/";
/* Namespacing — this bucket/database already hold other data, so everything
   this app writes lives under one prefix and nothing else is touched.
     Firestore : apps/down2chill/{events,people}/...
     Storage   : down2chill/events/{eventId}/photos/...                     */
const FS_ROOT    = ["apps", "down2chill"];
const PHOTO_ROOT = "down2chill/events";

let fb = null;      // { app, db, storage, auth, uid, api:{...} }

/* ---------------- logging ---------------- */
function logEl(){ return document.getElementById("fb-log"); }
function log(msg, cls){
  const el = logEl(); if(!el) return;
  if(el.querySelector(".dim") && el.children.length === 1 && el.textContent === "Ready.") el.textContent = "";
  const line = document.createElement("div");
  if(cls) line.className = cls;
  line.textContent = msg;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}
function ok(m){ log("\u2713 " + m, "ok"); }
function err(m){ log("\u2717 " + m, "err"); }
function warn(m){ log("! " + m, "warn"); }
function dim(m){ log(m, "dim"); }

/* ---------------- init ---------------- */
async function initFirebase(){
  if(fb) return fb;
  if(!KEY_OK) throw new Error(UNSUBBED(FB_CONFIG.apiKey)
    ? "apiKey is still the build placeholder — Cloudflare did not substitute it."
    : "apiKey is blank — set FB_CONFIG.apiKey.");

  const [{ initializeApp }, fs, st, au] = await Promise.all([
    import(SDK + "firebase-app.js"),
    import(SDK + "firebase-firestore.js"),
    import(SDK + "firebase-storage.js"),
    import(SDK + "firebase-auth.js")
  ]);

  const app     = initializeApp(FB_CONFIG);
  const db      = fs.getFirestore(app);
  const storage = st.getStorage(app);
  const auth    = au.getAuth(app);

  // Anonymous sign-in is optional. If it's not enabled, keep going —
  // it only matters when your rules require request.auth != null.
  let uid = null;
  try {
    const cred = await au.signInAnonymously(auth);
    uid = cred.user.uid;
    dim("signed in anonymously as " + uid.slice(0, 10) + "\u2026");
  } catch(e){
    warn("anonymous auth unavailable (" + e.code + ") — continuing unauthenticated");
  }

  fb = { app, db, storage, auth, uid, fs, st };
  return fb;
}

/* ---------------- connection panel ---------------- */
function renderConn(){
  const box = document.getElementById("fb-conn");
  if(!box) return;
  const rows = [
    ["projectId", FB_CONFIG.projectId, !!FB_CONFIG.projectId],
    ["bucket",    FB_CONFIG.storageBucket, !!FB_CONFIG.storageBucket],
    ["apiKey",    KEY_OK ? "set \u2713"
                  : UNSUBBED(FB_CONFIG.apiKey) ? "PLACEHOLDER — build did not substitute"
                  : "MISSING", KEY_OK],
    ["appId",     APP_OK ? "web app \u2713"
                  : UNSUBBED(FB_CONFIG.appId) ? "PLACEHOLDER — build did not substitute"
                  : FB_CONFIG.appId ? "NOT a web appId (must contain :web:)"
                  : "MISSING", APP_OK],
    ["origin",    location.protocol === "file:" ? "file:// — serve over http instead" : location.origin,
                  location.protocol !== "file:"],
    ["firestore",  FS_ROOT.join("/") + "/events", true],
    ["storage",    PHOTO_ROOT + "/", true]
  ];
  box.innerHTML = rows.map(r =>
    '<div class="fb-kv ' + (r[2] ? "good" : "bad") + '"><b>' + r[0] + '</b><span>' + r[1] + '</span></div>'
  ).join("");
}

/* ---------------- 1. seed ---------------- */
function eventDoc(ev, fsId, hostFsId){
  return {
    uid: fsId,                         // Firestore's own document id, mirrored into the doc
    slug: ev.id,                       // stable authored key — what upserts match on
    title: ev.title, titleLower: ev.title.toLowerCase(),
    dateISO: ev.date, time: ev.time, timeSort: t24(ev.time),
    venue: ev.venue, address: ev.address, about: ev.about,
    vibe: ev.vibe, capacity: ev.capacity, entry: ev.entry, inviteType: ev.invite,
    dot: ev.dot, role: ev.role,
    coverPath: "", coverUrl: IMG(ev.img, 1000, 1250),
    thumbUrl: IMG(ev.img, 400, 440),
    mapPath: "",  mapUrl: IMG(ev.map, 1200, 675),
    hostUid: hostFsId, hostName: pn(ev.hostId), hostAvatarUrl: pav(ev.hostId),
    counts: { going: ev.going, maybe: ev.maybe, cant: ev.cant, pending: ev.pending },
    guestPreview: ev.guests.slice(0, 5).map(g => ({
      uid: PERSON[g.id].fsId, name: pn(g.id), avatarUrl: pav(g.id), isHost: !!g.host
    })),
    photoCount: ev.photoCount, lastPhotoLabel: ev.photoWhen,
    seededAt: new Date().toISOString()
  };
}

async function seed(){
  const { db, fs } = await initFirebase();
  const { doc, collection, getDocs, query, where, limit, writeBatch } = fs;

  let batch = writeBatch(db), n = 0, total = 0;
  const flush = async (force) => {
    if(n >= 400 || (force && n > 0)){ await batch.commit(); batch = writeBatch(db); total += n; n = 0; }
  };
  const put = async (ref, data) => { batch.set(ref, data); n++; await flush(false); };
  const drop = async (ref) => { batch.delete(ref); n++; await flush(false); };

  /* Firestore generates every document id. To stay idempotent we look up the
     existing doc by its authored slug/handle and reuse that id; only genuinely
     new records get a fresh auto-id. Re-running can never duplicate.          */
  const idFor = async (colRef, field, value) => {
    const hit = await getDocs(query(colRef, where(field, "==", value), limit(1)));
    return hit.empty ? doc(colRef).id : hit.docs[0].id;
  };

  // ---- people ----
  dim("resolving people\u2026");
  const peopleCol = collection(db, ...FS_ROOT, "people");
  for(const p of SEED_PEOPLE){
    p.fsId = await idFor(peopleCol, "handle", p.id);
    await put(doc(peopleCol, p.fsId), {
      uid: p.fsId, handle: p.id, name: p.name, nameLower: p.name.toLowerCase(),
      avatarUrl: AV(p.avatar), avatarPath: ""
    });
  }
  await flush(true);
  ok("people: " + SEED_PEOPLE.length + " docs");

  // ---- events ----
  const eventsCol = collection(db, ...FS_ROOT, "events");
  for(const ev of SEED_EVENTS){
    ev.fsId = await idFor(eventsCol, "slug", ev.id);
    const evRef = doc(eventsCol, ev.fsId);
    dim(ev.title + " \u2192 " + ev.fsId);

    await put(evRef, eventDoc(ev, ev.fsId, PERSON[ev.hostId].fsId));

    // guests are keyed by the person's Firestore id, so they're upserts too
    for(const g of ev.guests)
      await put(doc(evRef, "guests", PERSON[g.id].fsId), {
        personUid: PERSON[g.id].fsId, eventUid: ev.fsId, status: "going",
        name: pn(g.id), avatarUrl: pav(g.id),
        message: g.msg || "", invitedLabel: g.when, isHost: !!g.host, isYou: !!g.you
      });
    for(const g of ev.waiting)
      await put(doc(evRef, "guests", PERSON[g.id].fsId), {
        personUid: PERSON[g.id].fsId, eventUid: ev.fsId, status: "pending",
        name: pn(g.id), avatarUrl: pav(g.id),
        message: "", invitedLabel: g.when, isHost: false, isYou: false
      });

    /* photos / activity / messages have no natural key, so they get pure
       auto-ids. Clear the previously seeded ones first — uploads are kept. */
    for(const sub of ["photos", "activity", "messages"]){
      const existing = await getDocs(query(collection(evRef, sub), where("source", "==", "seed")));
      for(const d of existing.docs) await drop(d.ref);
    }

    for(let i = 0; i < ev.allPhotos.length; i++){
      const ph = ev.allPhotos[i];
      await put(doc(collection(evRef, "photos")), {
        eventUid: ev.fsId, path: "", url: IMG(ph.seed, 1400, 1400), thumbUrl: IMG(ph.seed, 600, 600),
        byUid: PERSON[ph.byId].fsId, byName: pn(ph.byId), whenLabel: ph.when, order: i, source: "seed"
      });
    }
    for(let i = 0; i < ev.activity.length; i++){
      const a = ev.activity[i];
      await put(doc(collection(evRef, "activity")), {
        eventUid: ev.fsId, personUid: PERSON[a.id].fsId, personName: pn(a.id),
        icon: a.ic, isCheck: !!a.ok, text: a.txt, whenLabel: a.t, order: i, source: "seed"
      });
    }
    await put(doc(collection(evRef, "messages")), {
      eventUid: ev.fsId, fromUid: PERSON[ev.chat.fromId].fsId, fromName: pn(ev.chat.fromId),
      text: ev.chat.msg, whenLabel: ev.chat.time, unread: ev.chat.unread || 0, source: "seed"
    });
  }

  await flush(true);
  ok("seeded " + SEED_EVENTS.length + " events \u2014 " + total + " writes, all ids from Firestore");
  if(STORE.mode !== "live") await connectLive();
  dim("pool-party document id = " + SEED_BY_ID["pool-party"].fsId);
  const sel = document.getElementById("fb-ev");
  if(sel) Array.from(sel.options).forEach(o => { const e = SEED_BY_ID[o.dataset.local]; if(e) o.value = e.fsId; });
}

/* ---------------- 2. upload ---------------- */
async function upload(){
  const { db, storage, fs, st } = await initFirebase();
  const input  = document.getElementById("fb-file");
  const sel    = document.getElementById("fb-ev");
  const local  = SEED_BY_ID[sel.selectedOptions[0].dataset.local];
  const evId   = local && local.fsId ? local.fsId : sel.value;
  if(!local || !local.fsId)
    throw new Error("Run step 1 first — the event has no Firestore id yet in this session.");
  const file   = input.files && input.files[0];
  if(!file) throw new Error("Choose an image file first.");
  if(file.size > 25 * 1024 * 1024)
    throw new Error("File is " + (file.size/1048576).toFixed(1) + " MB — the rules cap uploads at 25 MB.");

  const safe = file.name.replace(/[^\w.\-]+/g, "_");
  const path = PHOTO_ROOT + "/" + evId + "/photos/" + Date.now() + "_" + safe;
  dim("uploading " + (file.size / 1024).toFixed(0) + " KB to " + path);

  const ref  = st.ref(storage, path);
  const snap = await st.uploadBytes(ref, file, { contentType: file.type });
  ok("uploaded to Storage (" + snap.metadata.size + " bytes)");

  const url = await st.getDownloadURL(ref);
  ok("download URL resolved");
  dim(url);

  const photoRef = fs.doc(fs.collection(db, ...FS_ROOT, "events", evId, "photos"));
  await fs.setDoc(photoRef, {
    path, url, thumbUrl: url,
    eventUid: evId, byUid: PERSON["emily"].fsId, byName: PERSON["emily"].name,
    whenLabel: "Just now",
    order: 999, source: "upload", uploadedAt: fs.serverTimestamp()
  });
  ok("Firestore photo doc created: " + FS_ROOT.join("/") + "/events/" + evId + "/photos/" + photoRef.id);

  await fs.updateDoc(fs.doc(db, ...FS_ROOT, "events", evId), { photoCount: fs.increment(1) });
  ok("photoCount incremented on " + FS_ROOT.join("/") + "/events/" + evId);

  const wrap = document.getElementById("fb-prevwrap");
  if(wrap) wrap.innerHTML = '<img class="fb-prev" src="' + url + '" alt="Uploaded preview">';
}

/* ---------------- 3. read tests ---------------- */
async function testReads(){
  const { db, storage, fs, st } = await initFirebase();
  let pass = 0, fail = 0;
  const step = async (label, fn) => {
    try { const r = await fn(); ok(label + (r ? " \u2014 " + r : "")); pass++; }
    catch(e){ err(label + " \u2014 " + (e.code || "") + " " + e.message); fail++; }
  };

  await step("Firestore: list events", async () => {
    const snap = await fs.getDocs(fs.query(fs.collection(db, ...FS_ROOT, "events"), fs.limit(50)));
    if(snap.empty) throw new Error("collection is empty — run step 1 first");
    return snap.size + " docs (" + snap.docs.slice(0, 3).map(d => d.data().title).join(", ") + "\u2026)";
  });

  await step("Firestore: ordered query (dateISO)", async () => {
    const snap = await fs.getDocs(fs.query(fs.collection(db, ...FS_ROOT, "events"),
                   fs.orderBy("dateISO"), fs.limit(3)));
    return snap.docs.map(d => d.data().dateISO).join(" \u2192 ");
  });

  await step("Firestore: read one event doc", async () => {
    const id = SEED_BY_ID["pool-party"].fsId;
    if(!id) throw new Error("run step 1 first (no Firestore id for pool-party yet)");
    const d = await fs.getDoc(fs.doc(db, ...FS_ROOT, "events", id));
    if(!d.exists()) throw new Error("events/" + id + " missing");
    const v = d.data();
    return v.title + " @ " + v.venue + ", " + v.counts.going + " going";
  });

  await step("Firestore: read subcollection (guests)", async () => {
    const snap = await fs.getDocs(fs.collection(db, ...FS_ROOT, "events", SEED_BY_ID["pool-party"].fsId, "guests"));
    return snap.size + " guest docs";
  });

  // The app never crawls the bucket — it reads a path from Firestore and resolves it.
  // That is what we test here; a listAll() is only a coarse extra diagnostic.
  let firstUrl = null, firstPath = null;

  await step("Firestore: find an uploaded photo", async () => {
    const id = SEED_BY_ID["pool-party"].fsId;
    if(!id) throw new Error("run step 1 first");
    const snap = await fs.getDocs(fs.query(
      fs.collection(db, ...FS_ROOT, "events", id, "photos"),
      fs.where("source", "==", "upload"), fs.limit(1)));
    if(snap.empty) throw new Error("no uploaded photos on Pool Party yet — run step 2 first");
    const d = snap.docs[0].data();
    firstPath = d.path; firstUrl = d.url;
    return d.path;
  });

  if(firstPath){
    await step("Storage: resolve stored path", async () => {
      firstUrl = await st.getDownloadURL(st.ref(storage, firstPath));
      return "URL resolved from Firestore path";
    });
    await step("Browser: load that image", () => new Promise((res, rej) => {
      const im = new Image();
      im.onload  = () => res(im.naturalWidth + "\u00D7" + im.naturalHeight + " px");
      im.onerror = () => rej(new Error("image failed to load (check Storage read rule)"));
      im.src = firstUrl;
    }));
  }

  await step("Storage: list prefix (optional)", async () => {
    const res = await st.listAll(st.ref(storage, PHOTO_ROOT));
    return res.prefixes.length + " event folder(s), " + res.items.length + " loose file(s)";
  });

  log("");
  (fail ? warn : ok)("read tests finished — " + pass + " passed, " + fail + " failed");
}

/* ---------------- live data ---------------- */
let unsubEvents = null, unsubDetail = [], watchingId = null;

async function connectLive(){
  if(!KEY_OK){
    useLocalData(UNSUBBED(FB_CONFIG.apiKey)
      ? "Build placeholder not substituted — showing bundled sample data."
      : "Firebase not configured — showing bundled sample data.");
    return;
  }
  try {
    const { db, fs } = await initFirebase();
    // Every event document, ordered by date, streamed continuously.
    unsubEvents = fs.onSnapshot(
      fs.query(fs.collection(db, ...FS_ROOT, "events"), fs.orderBy("dateISO")),
      snap => {
        STORE.setEvents(snap.docs.map(d => docToModel(d.id, d.data())), "live");
        dim("events snapshot: " + snap.size + " docs" +
            (snap.metadata.fromCache ? " (cache)" : ""));
        if(watchingId) watchDetail(watchingId);   // re-attach if the doc set changed
      },
      e => { err("events listener: " + e.code); useLocalData("Firestore read failed (" + e.code + ")."); }
    );
  } catch(e){
    useLocalData("Firebase init failed: " + e.message);
  }
}

/* Subcollections stream only while a detail view is open. */
async function watchDetail(id){
  const ev = findEvent(id);
  if(!ev) return;
  if(STORE.mode === "local"){ STORE.setDetail(id, seedDetail(ev)); return; }

  const { db, fs } = await initFirebase();
  const base = [db, ...FS_ROOT, "events", ev.id];

  unsubDetail.push(fs.onSnapshot(fs.collection(...base, "guests"), snap => {
    const all = snap.docs.map(d => d.data());
    STORE.setDetail(id, {
      guests:  all.filter(g => g.status === "going").map(mapGuest),
      waiting: all.filter(g => g.status === "pending").map(mapGuest)
    });
  }, e => err("guests: " + e.code)));

  unsubDetail.push(fs.onSnapshot(fs.query(fs.collection(...base, "photos"), fs.orderBy("order")),
    snap => STORE.setDetail(id, { photos: snap.docs.map(d => {
      const p = d.data();
      return { url: p.url, thumbUrl: p.thumbUrl || p.url, byName: p.byName || "Someone",
               byAvatarUrl: p.byAvatarUrl || "", whenLabel: p.whenLabel || "" };
    })}), e => err("photos: " + e.code)));

  unsubDetail.push(fs.onSnapshot(fs.query(fs.collection(...base, "activity"), fs.orderBy("order")),
    snap => STORE.setDetail(id, { activity: snap.docs.map(d => {
      const a = d.data();
      return { personName: a.personName || "Someone", personAvatarUrl: a.personAvatarUrl || "",
               icon: a.icon || "check", isCheck: !!a.isCheck, text: a.text || "",
               whenLabel: a.whenLabel || "", quote: /^[\u201C"]/.test(a.text || "") };
    })}), e => err("activity: " + e.code)));

  unsubDetail.push(fs.onSnapshot(fs.query(fs.collection(...base, "messages"), fs.limit(1)),
    snap => {
      const m = snap.empty ? null : snap.docs[0].data();
      STORE.setDetail(id, { chat: m
        ? { fromName: m.fromName || "Someone", fromAvatarUrl: m.fromAvatarUrl || "",
            text: m.text || "", whenLabel: m.whenLabel || "", unread: m.unread || 0 }
        : { fromName: "", fromAvatarUrl: "", text: "No messages yet.", whenLabel: "", unread: 0 } });
    }, e => err("messages: " + e.code)));
}

function mapGuest(g){
  return { name: g.name || "Guest", avatarUrl: g.avatarUrl || "", message: g.message || "",
           invitedLabel: g.invitedLabel || "", isHost: !!g.isHost, isYou: !!g.isYou,
           status: g.status || "going" };
}

function stopDetail(){ unsubDetail.forEach(u => { try{ u(); }catch(e){} }); unsubDetail = []; }

window.D2C = {
  watchEvent(id){ watchingId = id; stopDetail(); watchDetail(id); },
  unwatchEvent(){ watchingId = null; stopDetail(); },
  reconnect: connectLive
};

/* ---------------- wiring ---------------- */
function run(btn, label, fn){
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = label;
  Promise.resolve()
    .then(fn)
    .catch(e => { err((e.code ? e.code + " — " : "") + e.message); console.error(e); })
    .finally(() => { btn.disabled = false; btn.textContent = old; });
}

document.addEventListener("click", e => {
  const t = e.target.closest("#fb-seed, #fb-upload, #fb-test");
  if(!t) return;
  if(t.id === "fb-seed")   run(t, "Seeding\u2026",   () => seed(t));
  if(t.id === "fb-upload") run(t, "Uploading\u2026", upload);
  if(t.id === "fb-test")   run(t, "Testing\u2026",   testReads);
});

// The debug view is rendered by the router; refresh the panel whenever it appears.
new MutationObserver(() => { if(document.getElementById("fb-conn")) renderConn(); })
  .observe(document.getElementById("app"), { childList: true });
if(document.getElementById("fb-conn")) renderConn();

// Start streaming (or fall back to bundled data if the key is missing).
connectLive();
</script>
